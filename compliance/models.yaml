  - id: imaging-demo-organamnist
    kind: imaging
    name: Abdominal CT organ classifier (small CNN trained on OrganAMNIST 64px)
    version: "trained 2026-09-17; validation accuracy 0.989, test accuracy 0.963 (synthetic-split benchmark)"
    provider: Trained with GroundCheckHealth's training studio
    licence: "Model: MIT with the repository. Training data: OrganAMNIST (MedMNIST v2, CC BY 4.0, derived from the LiTS CT collection)."
    intended_use: Demonstration of the imaging pipeline with abstention on unfamiliar images. Research and evaluation only.
    not_for: Any clinical use. It is not a medical device and has no external validation.
    data_leaves_machine: false
    notes: Organ-centred crops, not full slices; abstains on most real scans.

  - id: imaging-demo-pneumoniamnist
    kind: imaging
    name: "Paediatric chest X-ray: pneumonia (small CNN trained on PneumoniaMNIST 64px)"
    version: "trained 2026-09-17; validation accuracy 0.963, test accuracy 0.894 (benchmark split)"
    provider: Trained with GroundCheckHealth's training studio
    licence: "Model: MIT with the repository. Training data: PneumoniaMNIST (MedMNIST v2, CC BY 4.0, from Kermany et al. chest X-ray images)."
    intended_use: Demonstration of the imaging pipeline. Research and evaluation only.
    not_for: Any clinical use. It is not a medical device and has no external validation.
    data_leaves_machine: false
    notes: One institution's paediatric images; does not generalise.
