# Register of the machine-learning models GroundCheckHealth uses or ships: what each is,
# its version and licence, what it is for and what it must not be used for.
# `python scripts/soup_list.py` checks it is complete: every default model in app/config.py
# and every model in the Local AI catalogue must be listed, with the fields below.
#
# Intended use is a statement about this software, not a claim about the model in general.
# No model here makes the answer/refuse decision: that is deterministic code (see
# GC-REQ-006), and every generated claim is re-checked against the sources.

models:
  - id: embed-minilm
    kind: embedding
    name: sentence-transformers/all-MiniLM-L6-v2
    version: "unpinned: the revision current at install time (record it in the deployment's release notes)"
    provider: Sentence-Transformers / Microsoft (Hugging Face Hub)
    licence: Apache-2.0
    config_key: EMBED_MODEL
    intended_use: Ranks approved source passages by similarity to a de-identified question, alongside keyword (BM25) scoring.
    not_for: Deciding whether to answer; generating text; any language other than English.
    data_leaves_machine: false
    notes: Runs locally after a one-off download. English only.

  - id: gen-llama33-70b
    kind: generation
    name: llama-3.3-70b-versatile
    version: "as served by the provider; not pinned"
    provider: Groq (OpenAI-compatible API), model by Meta
    licence: Llama 3.3 Community License (served under the provider's terms)
    config_key: GEN_MODEL
    intended_use: Drafts claims, each citing a retrieved source passage, from a de-identified question and approved passages.
    not_for: Answering without sources; any decision that is not re-checked by the deterministic guards.
    data_leaves_machine: true
    notes: Only de-identified text and approved passages are sent. Off when no key is set; extractive mode uses no model.

  - id: judge-llama31-8b
    kind: judge
    name: llama-3.1-8b-instant
    version: "as served by the provider; not pinned"
    provider: Groq (OpenAI-compatible API), model by Meta
    licence: Llama 3.1 Community License (served under the provider's terms)
    config_key: JUDGE_MODEL
    intended_use: A second opinion on whether a claim is supported by its cited passage. Its verdict can only add a refusal.
    not_for: Turning a refusal into an answer.
    data_leaves_machine: true
    notes: Same data handling as the generation model.

  - id: local-gemma3-1b
    kind: generation
    name: "gemma3:1b"
    version: "Ollama tag as downloaded by the user"
    provider: Google (via Ollama)
    licence: Gemma Terms of Use
    intended_use: Local drafting of claims on a machine with little memory; the guards decide.
    not_for: Clinical decisions without the deterministic checks.
    data_leaves_machine: false
    notes: Chosen in the Local AI panel; weights are the user's download.

