name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Monday, for the full safety evaluation and fresh advisories

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the search index from the synthetic corpus
        run: python scripts/build_index.py

      - name: Run the evaluation (offline, extractive mode)
        run: python scripts/run_eval.py

      - name: Run the test suite (no network)
        run: pytest -q

      - name: Large safety evaluation (a sample on every push, all of it weekly)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/stress_eval.py
          else
            python scripts/stress_eval.py --sample 20000
          fi

      - name: Upload the safety evaluation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-summary
          path: eval/stress_summary.json

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the scanners
        run: pip install pip-audit bandit

      - name: Dependencies with known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Static analysis
        run: bandit -r app -q -ll

      - name: Bill of materials and licences
        run: |
          pip install cyclonedx-bom pip-licenses
          pip install -r requirements.txt
          cyclonedx-py environment -o sbom.json --output-format json
          pip-licenses --format=csv --with-urls > third-party-licences.csv

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            third-party-licences.csv

  container:
    name: Container image
    # The image build runs the index build and the full evaluation inside it,
    # so this is weekly and on demand rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t groundcheck:test .

      - name: Run it the way a site would, and check what it kept
        run: scripts/container_smoke.sh groundcheck:test

  integrations:
    name: Live EHR and PACS
    # These talk to public sandboxes, so they can't gate a merge: a sandbox
    # being down isn't a regression. Weekly is soon enough to notice a real
    # break in the FHIR, SMART, CDS Hooks or DICOMweb paths.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the search index
        run: python scripts/build_index.py

      # The public HAPI FHIR server, the SMART launcher, and the public
      # Orthanc demo. The local-Orthanc round trip stays a manual test: it
      # needs a PACS with a CT study already loaded.
      - name: Talk to a real FHIR server and a real PACS
        run: pytest tests/test_ehr.py tests/test_imaging.py -q
        env:
          RUN_LIVE_EHR: "1"
          RUN_LIVE_PACS: "1" 

  browser:
    name: Browser journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the search index
        run: python scripts/build_index.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: Install the browser
        working-directory: tests/ui
        run: npm install

      - name: Start GroundCheck
        run: |
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:8000/healthz/ready >/dev/null && break
            sleep 2
          done
        env:
          FORCE_EXTRACTIVE: "true"

      - name: Walk through the app in a browser
        working-directory: tests/ui
        run: npm test
        env:
          GROUNDCHECK_URL: http://127.0.0.1:8000

  site:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: Check pages, links, and CSP compatibility
        run: npm run check
