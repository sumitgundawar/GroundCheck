name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Monday, for the full safety evaluation and fresh advisories

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Optional packages the tracing tests use
        run: pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http opentelemetry-exporter-otlp-proto-grpc

      - name: Build the search index from the synthetic corpus
        run: python scripts/build_index.py

      - name: Run the evaluation (offline, extractive mode)
        run: python scripts/run_eval.py

      - name: Run the test suite (no network)
        run: pytest -q
        env:
          REQUIRE_OTEL: "1"

      - name: Requirements traceability (fails on a requirement without a passing test)
        run: |
          mkdir -p build
          python scripts/trace_matrix.py --strict --markdown build/trace.md

      - name: Controls matrix (fails on a control that points at nothing)
        run: python scripts/controls_report.py --check

      - name: Languages (unsupported languages refused, English never, Spanish subset 0 unsafe)
        run: python scripts/language_eval.py

      - name: Interface strings are in step with the page
        run: python scripts/i18n_extract.py --check

      - name: Guards, against claims that are wrong
        run: python scripts/guard_eval.py

      - name: Verify API, against answers that are wrong (fails on any wrong answer passed)
        run: python scripts/verify_eval.py

      - name: Python SDK
        run: pytest -q sdk/python/tests

      - name: Large safety evaluation (a sample on every push, all of it weekly)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/stress_eval.py
          else
            python scripts/stress_eval.py --sample 20000
          fi

      - name: Upload the safety evaluation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-summary
          path: eval/stress_summary.json

      - name: Upload the traceability matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: build/trace.md

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: Install
        run: npm ci

      - name: Test (including the ESM and CJS builds)
        run: npm test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the scanners
        run: pip install pip-audit bandit

      - name: Dependencies with known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Static analysis
        run: bandit -r app -q -ll

      - name: Bill of materials and licences
        run: |
          pip install cyclonedx-bom pip-licenses
          pip install -r requirements.txt
          cyclonedx-py environment -o sbom.json --output-format json
          pip-licenses --format=csv --with-urls > third-party-licences.csv

      - name: Software of unknown provenance list and model register
        run: |
          pip install pyyaml
          python scripts/soup_list.py --sbom sbom.json --markdown soup.md

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            third-party-licences.csv
            soup.md

  restore-drill:
    name: Backup and restore drill (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groundcheck
          POSTGRES_PASSWORD: groundcheck
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundcheck -d drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://groundcheck:groundcheck@127.0.0.1:5432/drill
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and the PostgreSQL client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "psycopg[binary]==3.*"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Build the search index
        run: python scripts/build_index.py

      # Create the database, seed accounts, audit records and review cases,
      # back up with pg_dump, drop everything, restore with psql. Fails if any
      # table's row count differs, the audit chain head differs, or
      # verify-audit does not pass; then edits a record to prove a changed
      # trail is caught and that restoring repairs it.
      - name: Back up, wipe, restore, verify
        run: python scripts/db_restore_drill.py --tamper-check

      - name: The drill's own tests, against PostgreSQL too
        run: pytest -q tests/test_restore_drill.py
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://groundcheck:groundcheck@127.0.0.1:5432/drill

  container:
    name: Container image
    # The image build runs the index build and the full evaluation inside it,
    # so this is weekly and on demand rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t groundcheck:test .

      - name: Run it the way a site would, and check what it kept
        run: scripts/container_smoke.sh groundcheck:test

  integrations:
    name: Live EHR and PACS
    # These talk to public sandboxes, so they can't gate a merge: a sandbox
    # being down isn't a regression. Weekly is soon enough to notice a real
    # break in the FHIR, SMART, CDS Hooks or DICOMweb paths.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the search index
        run: python scripts/build_index.py

      # The public HAPI FHIR server, the SMART launcher, and the public
      # Orthanc demo. The local-Orthanc round trip stays a manual test: it
      # needs a PACS with a CT study already loaded.
      - name: Talk to a real FHIR server and a real PACS
        run: pytest tests/test_ehr.py tests/test_imaging.py -q
        env:
          RUN_LIVE_EHR: "1"
          RUN_LIVE_PACS: "1" 

  browser:
    name: Browser journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the search index
        run: python scripts/build_index.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: Install the browser
        working-directory: tests/ui
        run: npm install

      - name: Start GroundCheckHealth
        run: |
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:8000/healthz/ready >/dev/null && break
            sleep 2
          done
        env:
          FORCE_EXTRACTIVE: "true"

      - name: Walk through the app in a browser
        working-directory: tests/ui
        run: npm test
        env:
          GROUNDCHECK_URL: http://127.0.0.1:8000

  site:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: Check pages, links, and CSP compatibility
        run: npm run check
