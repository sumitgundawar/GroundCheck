name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work.
  - type: textarea
    id: safety
    attributes:
      label: Effect on refusals
      description: Could this change make GroundCheck answer something it currently refuses? How would we test that?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
