apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "groundcheck.fullname" . }}
  labels:
    {{- include "groundcheck.labels" . | nindent 4 }}
data:
  PORT: "8000"
  INSTANCE_NAME: {{ include "groundcheck.fullname" . | quote }}
  AUDIT_LOG_PATH: /data/audit/audit_log.jsonl
  LOCAL_AI_STATE_PATH: /data/local_ai.json
  INDEX_DIR: /data/index
  MODEL_LIBRARY_DIR: /data/models/library
  TRAINING_RUNS_DIR: /data/models/runs
  TRAINING_DATA_DIRS: /data/datasets
  IMAGING_DIR: /data/imaging
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
